<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1a1917">
  <meta name="description" content="Browse local Codex, Claude Code and Pi sessions by date and project.">
  <title>Worklog · Daily activity</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f55d0'/%3E%3Cg fill='%23ffffff'%3E%3Crect x='9' y='15' width='4' height='9' rx='2'/%3E%3Crect x='14' y='8' width='4' height='16' rx='2'/%3E%3Crect x='19' y='12' width='4' height='12' rx='2'/%3E%3C/g%3E%3C/svg%3E">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div><strong>Worklog</strong><span>Agent history</span></div>
      </div>
      <nav class="view-nav" aria-label="History views">
        <button type="button" data-view="date" aria-pressed="true">By date</button>
        <button type="button" data-view="project" aria-pressed="false">By project</button>
      </nav>
      <section id="history" aria-label="Activity by day">
        <div class="calendar">
          <div class="calendar-toolbar">
            <button id="calendar-toggle" type="button" aria-expanded="true" aria-controls="calendar-body"><span id="calendar-month" aria-live="polite"></span></button>
            <div id="calendar-controls"></div>
          </div>
          <div id="calendar-body">
            <div id="calendar-grid" class="calendar-grid" role="group" aria-labelledby="calendar-month"></div>
            <div class="calendar-footer">
              <span id="calendar-stats"></span>
              <span class="calendar-scale" role="img" aria-label="Daily token use, from less to more" title="Brighter days used more tokens within this month."><span>Less</span><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i><span>More</span></span>
            </div>
          </div>
        </div>
        <div class="history-columns" aria-hidden="true"><span>History</span><span>Sessions</span><span>Tokens</span></div>
        <nav id="dates" class="date-list" aria-label="Activity dates"></nav>
      </section>
      <section id="project-history" aria-label="Activity by project" hidden>
        <fieldset id="project-period">
          <legend>Activity window</legend>
          <div class="period-options">
            <label><input type="radio" name="project-days" value="1"><span>1 day</span></label>
            <label><input type="radio" name="project-days" value="3" checked><span>3 days</span></label>
            <label><input type="radio" name="project-days" value="7"><span>7 days</span></label>
          </div>
        </fieldset>
        <div class="folder-header side-label">Working directories <span id="project-count"></span></div>
        <nav id="project-list" class="project-list" aria-label="Working directories"></nav>
      </section>
      <div class="sidebar-footer">
        <span class="local-dot"></span> Local &amp; read-only
        <button id="theme-toggle" type="button" class="theme-toggle"></button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span id="bar-icon"></span><span id="view-label">Daily activity</span></div>
        <fieldset id="source" class="source-filter">
          <legend>Filter by agent</legend>
          <label><input type="radio" name="source" value="" checked><span>All</span></label>
          <label class="harness-codex"><input type="radio" name="source" value="codex"><span>Codex</span></label>
          <label class="harness-claude"><input type="radio" name="source" value="claude"><span>Claude</span></label>
          <label class="harness-pi"><input type="radio" name="source" value="pi"><span>Pi</span></label>
        </fieldset>
        <div class="search">
          <span id="search-icon"></span>
          <input id="search" type="search" aria-label="Search sessions and prompts" placeholder="Search sessions and prompts…" autocomplete="off">
          <kbd id="search-shortcut">⌘ K</kbd>
        </div>
      </header>
      <main id="main" class="content" aria-busy="true">
        <div class="loading"><span class="spinner"></span> Reading local agent history…</div>
      </main>
    </div>
  </div>
  <dialog id="detail" class="drawer" aria-labelledby="detail-title">
    <div class="drawer-header"><div class="drawer-label">Session details</div><button type="button" class="icon-button" id="close-detail" aria-label="Close session details"></button></div>
    <div class="drawer-content" id="detail-content"></div>
  </dialog>
</body>
</html>
