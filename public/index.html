<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172135">
  <meta name="description" content="A local, read-only view of your Codex work by day and project.">
  <title>Worklog · Daily activity</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div><strong>Worklog</strong><span>Codex history</span></div>
      </div>
      <nav class="view-nav" aria-label="History views">
        <button type="button" data-view="date" aria-pressed="true">By date</button>
        <button type="button" data-view="project" aria-pressed="false">By project</button>
      </nav>
      <section id="history" aria-label="Activity by day">
        <div class="sidebar-section">
          <div class="side-label">Last 14 days</div>
          <div id="pulse" class="pulse" aria-label="Sessions in the last 14 days"></div>
          <div id="pulse-range" class="pulse-range"></div>
        </div>
        <div class="date-header side-label">History</div>
        <nav id="dates" class="date-list" aria-label="Activity dates"></nav>
      </section>
      <section id="project-history" aria-label="Activity by project" hidden>
        <div class="date-header side-label">Projects</div>
        <nav id="project-list" class="date-list project-list" aria-label="Working directories"></nav>
      </section>
      <div class="sidebar-footer"><span class="local-dot"></span> Local &amp; read-only</div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span id="bar-icon"></span><span id="view-label">Daily activity</span></div>
        <div class="search">
          <span id="search-icon"></span>
          <input id="search" type="search" aria-label="Search sessions and prompts" placeholder="Search sessions and prompts…" autocomplete="off">
          <kbd id="search-shortcut">⌘ K</kbd>
        </div>
      </header>
      <main id="main" class="content" aria-busy="true">
        <div class="loading"><span class="spinner"></span> Reading local Codex history…</div>
      </main>
    </div>
  </div>
  <dialog id="detail" class="drawer" aria-labelledby="detail-title">
    <div class="drawer-header"><div class="drawer-label">Session details</div><button type="button" class="icon-button" id="close-detail" aria-label="Close session details"></button></div>
    <div class="drawer-content" id="detail-content"></div>
  </dialog>
</body>
</html>
